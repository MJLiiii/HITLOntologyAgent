# Install as /etc/nginx/sites-available/ontology-studio, then enable its symlink.
# Replace studio.example.invalid and provision the named certificate/key first.
# Include this file inside nginx's http context; do not replace nginx.conf itself.
server {
    listen 80;
    listen [::]:80;
    server_name studio.example.invalid;
    if ($host != studio.example.invalid) { return 444; }
    return 308 https://studio.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.example.invalid;
    if ($host != studio.example.invalid) { return 444; }

    ssl_certificate /etc/ontology-studio/tls/fullchain.pem;
    ssl_certificate_key /etc/ontology-studio/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ontology_studio_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Match RequestBodyLimit: 20 MiB file plus 64 KiB request overhead.
    client_max_body_size 20544k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    location / {
        # No URI suffix: /api/v1 paths and the built UI keep their exact paths.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        # Mutations and uncertain upstream failures must not be replayed.
        proxy_next_upstream off;
        # Preserve application cookies, CSRF headers and Cache-Control.
        proxy_cache off;
    }
}
