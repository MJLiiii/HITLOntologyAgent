name: ontology-studio
services:
  postgres:
    # Official multi-platform manifest verified against registry-1.docker.io, 2026-11-01.
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ontology_studio
      POSTGRES_USER: ontology_studio
      POSTGRES_PASSWORD: ${OE_POSTGRES_PASSWORD:?Set OE_POSTGRES_PASSWORD in the shell or .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology_studio -d ontology_studio"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
